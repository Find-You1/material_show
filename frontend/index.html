<!DOCTYPE html>
<html lang="zh-CN">

    <meta name="theme-color" content="#f6f4f0" />
    <link rel="icon" href="data:," />
    <!--
      西文/数字用 Inter，中文仍走系统字族（PingFang / 微软雅黑），
      只付拉丁字形的体积。media="print" + onload 是非阻塞写法：
      即使 CDN 拿不到，也只是回落系统字体，不会拖慢首屏。
    -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <title>图片素材社区</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
