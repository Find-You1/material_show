# 宝塔：网站 → 你的站点 → 设置 → 配置文件，把下面内容合并进 server { } 里。
#
# 作用：静态文件仍由 Nginx 直接发，/api 与 /media 转给本机 8010 的 uvicorn。
#       （本机 8000 被另一个项目占着，所以后端挪到 8010，见 deploy.sh 的 PORT）
# 走这条路前端一行代码都不用改 —— api/http.js 里 baseURL 是相对路径 '/api'，
# 同源之后浏览器根本不发跨域请求，main.py 里的 CORS 中间件形同虚设，也不用动它。
#
# ⚠️ 三个漏了必踩坑的点：
#   1. client_max_body_size —— Nginx 默认只收 1MB，不改传图直接 413
#   2. try_files 回退 index.html —— 否则 /search、/c/nature 这类前端路由刷新即 404
#   3. Upgrade / Connection 两个头 —— 缺一个 /api/ws 的 WebSocket 就握手失败
#
# ⚠️ 宝塔的 HTML 项目模板自带一个 location / ，请**替换**它而不是追加，
#    否则 nginx 会报 duplicate location 起不来。改完先 nginx -t 再 reload。

root /www/wwwroot/frontend/dist;
index index.html;

# 前端路由回退：找不到实体文件就交给 index.html，由 vue-router 接管
location / {
    try_files $uri $uri/ /index.html;
}

# 接口（含 WebSocket /api/ws）
location /api {
    proxy_pass http://127.0.0.1:8010;

    # 必须 ≥ .env 里的 MAX_UPLOAD_MB，否则大图先被 Nginx 挡在门外
    client_max_body_size 25m;
    # 3 Mbps 带宽下传 10MB 要近一分钟，别用默认的 60s
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 升级用的两个头。如果你的 nginx.conf 里已经定义了
    #   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # 那第二行建议换成 proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# 图片：local 存储下由后端的 /media 路由发文件（带下载计数与访问日志）
location /media {
    proxy_pass http://127.0.0.1:8010;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 文件名带内容哈希，可以放心长缓存
    expires 7d;
    add_header Cache-Control "public";
}