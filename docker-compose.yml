# P5 专用：本地 S3 兼容存储，用来验证 STORAGE_BACKEND=s3 的适配器。
#
# ✅ 镜像来源（2026-09-30 实测）：MinIO 已转 AIStor 商业版，官方分发全撤
#   （Docker Hub 下架、quay.io 401、dl.min.io 经典路径 410 Gone、只剩要 license 的 AIStor）。
#   这里用的是转版前最后一个完整开源版本 RELEASE.2024-12-18T13-15-44Z，
#   `minio --version` 明确显示 License: GNU AGPLv3，无需任何 license。
#   该标签在 daocloud 镜像源上有缓存，拉取后打回官方短名即可：
#     docker pull docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
#     docker tag  docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z minio/minio:RELEASE.2024-12-18T13-15-44Z
#     docker pull docker.m.daocloud.io/minio/mc:latest
#     docker tag  docker.m.daocloud.io/minio/mc:latest minio/mc:latest
#   （本机已完成上述步骤，镜像在本地，compose up 不需要联网拉取）
#
# 为什么不把 MySQL 也放进来：本机 3306 已经在跑，再起容器要改端口、多养一套密码，
# 收益为零。Docker 在这里的唯一价值是提供一个本地 S3 兼容存储。
#
# 用法（仓库根目录，Docker 可用时）：
#   docker compose up -d        # 起 MinIO，并自动建桶 + 设为匿名可读
#   docker compose down         # 停掉，数据留在 minio-data 卷里
#   docker compose down -v      # 连数据一起清掉
#
# 切换验证（backend/.env）：
#   STORAGE_BACKEND=s3
#   S3_PUBLIC_BASE_URL=http://127.0.0.1:9000   # 公开读 + 固定域名，避免预签名 URL 破坏浏览器缓存
# 重启后端后：新上传的图落 S3，而老图（images.storage_backend='local'）仍从本地盘读，
# 因为库里只存 key、URL 现算，两种后端可以无缝共存。（2026-09-30 已实测通过）
#
# 验证完记得改回 STORAGE_BACKEND=local —— 本项目默认落本地盘，MinIO 只用于验证 s3 适配器。

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: material-show-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API（前端 <img src> 走这里）
      - "9001:9001" # Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性初始化容器：建桶 + 开匿名下载权限。
  # 对应 .env 里配 S3_PUBLIC_BASE_URL 的「公开读」方案；
  # 若坚持用预签名 URL，这个容器可以不要，但瀑布流场景下缓存会整体失效。
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/material-show &&
      mc anonymous set download local/material-show &&
      echo '[minio-init] bucket material-show 已就绪（匿名可读）'
      "

volumes:
  minio-data: